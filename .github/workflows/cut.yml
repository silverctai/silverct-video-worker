name: cut

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cut
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 领取并剪辑任务
        env:
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
        run: bash cut.sh

      # 公开项目 60 天没有更新，GitHub 会暂停定时任务；这里每隔约一个月自动更新一次保持运行
      - name: 保持运行
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
